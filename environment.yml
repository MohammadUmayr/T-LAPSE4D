name: cntp
channels:
  - conda-forge
  - defaults
dependencies:
  # Pinned so a fresh `conda env create` and CI resolve the same interpreter. Without it conda picks
  # whatever is newest at the time, and two machines built weeks apart can end up on different
  # Python versions with different resolved dependencies.
  - python=3.14

  - xdem
  - numba
  - tqdm

  # Often specified in .condarc, but we want to make sure it's included here
  - ipykernel
  - jupyter
  - nb_conda_kernels
  - htop
  - tree
  - pytest          # run the test suite under tests/
  - coverage        # `coverage run -m pytest && coverage report` (configured in pyproject.toml)
  - pre-commit      # `pre-commit install` once, then the hooks run on every commit

  - laspy

  # Provides libGLU.so.1, which the Agisoft Metashape Python module links
  # against at import time (without it: "libGLU.so.1: cannot open shared
  # object file"). Not pulled in by any other dependency.
  - libglu

  # `identify` CLI for EXIF capture-time read in cntp.preprocess.homogenize_images
  - imagemagick

  - pip
  - pip:
    - py4dgeo
    # Metashape Python module (proprietary, not on PyPI)
    # Download Linux wheel from: agisoft.com → Downloads → Metashape Python 3 Module
    # Install manually: pip install metashape-2.3.1-...-linux_x86_64.whl
