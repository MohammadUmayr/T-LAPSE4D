[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlapse4d"
version = "0.1.0"
description = "A library for generating and processing point clouds from the timelapse photogrammetry along with surface change products"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns a mistyped @pytest.mark.foo into a collection error rather than a silently
# ignored decorator — a test you believe is skipped would otherwise run, and vice versa.
addopts = "--strict-markers --strict-config"
filterwarnings = [
    # laspy's ctypes structs warn under Python 3.14; not actionable from here.
    "ignore:Due to '_pack_':DeprecationWarning",
]

[tool.coverage.run]
source = ["tlapse4d"]
# Branch coverage reports untested `else` paths, not just untested lines.
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
# No type stubs exist for Metashape, py4dgeo, laspy or rasterio.
ignore_missing_imports = true
show_error_codes = true
