name: linting

# Runs the same hooks as .pre-commit-config.yaml, so they apply even to commits made with
# --no-verify or by someone who never ran `pre-commit install`.
on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
