ci:
    autofix_prs: false
    autoupdate_schedule: quarterly

repos:
        # Basic hygiene
        - repo: https://github.com/pre-commit/pre-commit-hooks
          rev: v6.0.0
          hooks:
                - id: check-yaml
                - id: check-toml
                - id: end-of-file-fixer
                  exclude: \.txt$
                - id: trailing-whitespace
                - id: check-merge-conflict
                # Point clouds, DEMs and orthos must never enter the history — once committed
                # they cannot be removed without rewriting it.
                - id: check-added-large-files
                  args: ['--maxkb=1000']

        # Fix common spelling mistakes
        - repo: https://github.com/codespell-project/codespell
          rev: v2.4.1
          hooks:
                - id: codespell
                  args: [
                    '--ignore-words-list', 'nd,ba,iop,ontop,alos,som',
                    '--'
                  ]
                  types_or: [python, markdown]
                  files: ^(cntp|tests)/

        # Lint the code using flake8. No autoformatter is configured deliberately: the codebase
        # aligns related assignments by hand (~260 lines), which black would collapse.
        - repo: https://github.com/pycqa/flake8
          rev: 7.3.0
          hooks:
                - id: flake8
                  args: [
                          '--max-line-length', '120',
                          # E203/E501: whitespace and line length are not enforced, since no
                          # formatter is wrapping lines for us.
                          # E226: missing whitespace around arithmetic operators — the numerical
                          # code writes `2*x + 3*y` intentionally.
                          '--extend-ignore', 'E203,E501,E226,E731,W503',
                          '--'
                  ]
                  additional_dependencies:
                          - flake8-comprehensions
                          - flake8-bugbear
                  files: ^(cntp|tests)/

        # Sort imports. Does not touch code bodies, only the import block.
        - repo: https://github.com/PyCQA/isort
          rev: 7.0.0
          hooks:
                - id: isort
                  args: ["--profile", "black", "--line-length", "120"]
                  files: ^(cntp|tests)/

        # Type-check the test suite. cntp/ is 86% annotated but not complete, so mypy is scoped to
        # tests/ for now — widen `files` to ^(cntp|tests)/ once plot.py carries annotations too.
        - repo: https://github.com/pre-commit/mirrors-mypy
          rev: v1.19.1
          hooks:
                - id: mypy
                  args: [
                        # No stubs for Metashape, py4dgeo, laspy or rasterio in the hook's env.
                        --ignore-missing-imports,
                        --show-error-codes,
                        --no-warn-unused-ignores,
                        --disable-error-code=attr-defined,
                        --disable-error-code=name-defined,
                  ]
                  additional_dependencies: [tokenize-rt, numpy]
                  files: ^tests/

        # Safety greps
        - repo: https://github.com/pre-commit/pygrep-hooks
          rev: v1.10.0
          hooks:
                # eval() can execute arbitrary code
                - id: python-no-eval
                # Enforce real type annotations rather than docstring type comments
                - id: python-use-type-annotations
